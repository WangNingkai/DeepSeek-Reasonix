<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">WeChat bot text command interaction</title><desc id="desc">A synthetic WeChat conversation showing Reasonix approval through numeric replies and slash commands.</desc><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="14" flood-color="#111827" flood-opacity=".14" stdDeviation="18"/></filter></defs><rect width="1280" height="720" fill="#f6f4ef"/><text x="72" y="82" fill="#15171a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">WeChat text commands</text><text x="72" y="118" fill="#69707d" font-family="Inter, Arial, sans-serif" font-size="18">WeChat uses text replies: reply 1 or 2 for pending approvals, or send slash commands.</text><rect width="488" height="512" x="88" y="152" fill="#fff" filter="url(#shadow)" rx="34"/><rect width="488" height="70" x="88" y="152" fill="#f7f8fa" rx="34"/><text x="132" y="196" fill="#20242b" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750">Bot Assistant</text><rect width="360" height="132" x="130" y="268" fill="#f0f1f4" rx="18"/><text x="158" y="306" fill="#101418" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="750">Approval required</text><text x="158" y="340" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="17">Tool: explore</text><text x="158" y="370" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="17">ID: 7 Reply 1 approve, 2 deny</text><rect width="72" height="54" x="420" y="438" fill="#95ec69" rx="18"/><text x="452" y="472" fill="#0f2912" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="760">1</text><rect width="250" height="62" x="130" y="532" fill="#f0f1f4" rx="18"/><text x="158" y="570" fill="#101418" font-family="Inter, Arial, sans-serif" font-size="20">Approved. Continuing.</text><rect width="566" height="398" x="642" y="202" fill="#15171a" rx="24"/><text x="684" y="258" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Text fallback works everywhere</text><circle cx="698" cy="314" r="6" fill="#52c41a"/><text x="718" y="322" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">Approval: reply 1 or send /approve 7.</text><circle cx="698" cy="374" r="6" fill="#ff4d4f"/><text x="718" y="382" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">Deny: reply 2 or send /deny 7.</text><circle cx="698" cy="434" r="6" fill="#fa3"/><text x="718" y="442" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">Ask: send /answer ask-1 2.</text><rect width="418" height="52" x="684" y="494" fill="#242933" rx="14"/><text x="710" y="527" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="18">/yolo status</text></svg>