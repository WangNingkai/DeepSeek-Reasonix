<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">Lark bot YOLO mode interaction</title><desc id="desc">A synthetic Lark chat showing the user enabling YOLO and Reasonix confirming that ordinary tool approvals are skipped.</desc><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="14" flood-color="#111827" flood-opacity=".15" stdDeviation="18"/></filter><linearGradient id="orange" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff7a45"/><stop offset="1" stop-color="#ff4d2e"/></linearGradient></defs><rect width="1280" height="720" fill="#f7f6f3"/><text x="72" y="82" fill="#15171a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">Lark YOLO mode</text><text x="72" y="118" fill="#69707d" font-family="Inter, Arial, sans-serif" font-size="18">Turn on YOLO from chat when you trust the task and want fewer approval prompts.</text><rect width="760" height="500" x="72" y="158" fill="#fff" filter="url(#shadow)" rx="24"/><rect width="760" height="58" x="72" y="158" fill="#fdf1ec" rx="24"/><circle cx="113" cy="188" r="15" fill="#ff5b3a"/><text x="140" y="197" fill="#20242b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Lark chat</text><rect width="194" height="58" x="560" y="248" fill="#eaf2ff" rx="18"/><text x="612" y="284" fill="#1f2a44" font-family="Menlo, Consolas, monospace" font-size="20">/yolo</text><circle cx="126" cy="386" r="22" fill="url(#orange)"/><text x="117" y="395" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="760">R</text><rect width="548" height="120" x="164" y="330" fill="#f4f5f7" stroke="#e1e4ea" rx="18"/><text x="196" y="372" fill="#101418" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="760">YOLO enabled</text><text x="196" y="410" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="18">Ordinary tool approvals will be skipped.</text><text x="196" y="438" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="18">Ask questions and plan approvals still wait.</text><rect width="280" height="58" x="474" y="492" fill="#eaf2ff" rx="18"/><text x="502" y="528" fill="#1f2a44" font-family="Inter, Arial, sans-serif" font-size="19">Fix the lint errors</text><rect width="500" height="42" x="164" y="582" fill="#f4f5f7" stroke="#e1e4ea" rx="13"/><text x="196" y="609" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="17">Running tools: explore -&gt; edit -&gt; test</text><rect width="330" height="360" x="878" y="210" fill="#15171a" rx="24"/><text x="914" y="266" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">Useful commands</text><rect width="244" height="42" x="914" y="306" fill="#242933" rx="12"/><text x="936" y="333" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="18">/yolo on</text><rect width="244" height="42" x="914" y="366" fill="#242933" rx="12"/><text x="936" y="393" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="18">/mode ask</text><rect width="244" height="42" x="914" y="426" fill="#242933" rx="12"/><text x="936" y="453" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="18">/status</text><text x="914" y="514" fill="#b8c0cc" font-family="Inter, Arial, sans-serif" font-size="17">Use Ask mode again for risky work.</text></svg>