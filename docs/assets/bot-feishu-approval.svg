<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1280 720"><title id="title">Feishu bot approval interaction</title><desc id="desc">A synthetic Feishu chat showing a Reasonix bot approval card with allow and deny buttons.</desc><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="14" flood-color="#111827" flood-opacity=".14" stdDeviation="18"/></filter><linearGradient id="blue" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset="1" stop-color="#2f6bff"/></linearGradient></defs><rect width="1280" height="720" fill="#f6f4ef" rx="0"/><text x="72" y="82" fill="#15171a" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">Feishu approval card</text><text x="72" y="118" fill="#69707d" font-family="Inter, Arial, sans-serif" font-size="18">When a sensitive tool needs permission, Reasonix sends a card with clear actions.</text><rect width="736" height="480" x="72" y="160" fill="#fff" filter="url(#shadow)" rx="24"/><rect width="736" height="58" x="72" y="160" fill="#f4f7ff" rx="24"/><circle cx="112" cy="189" r="15" fill="#3370ff"/><text x="140" y="197" fill="#20242b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Feishu chat</text><rect width="202" height="62" x="548" y="252" fill="#e8f1ff" rx="18"/><text x="579" y="290" fill="#1f2a44" font-family="Inter, Arial, sans-serif" font-size="19">Run the tests</text><circle cx="126" cy="388" r="22" fill="url(#blue)"/><text x="117" y="397" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="760">R</text><rect width="500" height="220" x="164" y="334" fill="#f4f5f7" stroke="#e1e4ea" rx="18"/><text x="196" y="376" fill="#101418" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="760">Approval required</text><text x="196" y="416" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="18">Tool: bash</text><text x="196" y="448" fill="#4f5663" font-family="Inter, Arial, sans-serif" font-size="18">Action: go test ./...</text><rect width="96" height="30" x="196" y="470" fill="#fff" stroke="#d7dbe3" rx="9"/><text x="214" y="491" fill="#313844" font-family="Menlo, Consolas, monospace" font-size="15">ID: 42</text><rect width="142" height="42" x="196" y="516" fill="#2f6bff" rx="12"/><text x="222" y="543" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Allow once</text><rect width="108" height="42" x="354" y="516" fill="#fff" stroke="#ff4d4f" stroke-width="2" rx="12"/><text x="389" y="543" fill="#d92d2b" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Deny</text><rect width="356" height="398" x="852" y="202" fill="#15171a" rx="24"/><text x="890" y="258" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="750">What the user does</text><circle cx="902" cy="314" r="6" fill="#52c41a"/><text x="922" y="322" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">Tap Allow once to continue this tool call.</text><circle cx="902" cy="374" r="6" fill="#ff4d4f"/><text x="922" y="382" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">Tap Deny to stop this operation.</text><circle cx="902" cy="434" r="6" fill="#fa3"/><text x="922" y="442" fill="#e9eef8" font-family="Inter, Arial, sans-serif" font-size="18">If the card expires, send the text command.</text><rect width="278" height="52" x="890" y="492" fill="#242933" rx="14"/><text x="914" y="525" fill="#fff" font-family="Menlo, Consolas, monospace" font-size="18">/approve 42</text></svg>